name: Deploy Portfolio Website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare deployment package
        run: |
          echo "Creating deployment package..."
          # Copy standalone build output
          mkdir -p deploy-package
          cp -r .next/standalone/. deploy-package/
          # Copy static files to standalone build
          cp -r .next/static deploy-package/.next/static
          cp -r public deploy-package/public
          # Copy PM2 ecosystem config
          cp ecosystem.config.js deploy-package/
          # Create tarball
          tar -czf portfolio-build.tar.gz -C deploy-package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: portfolio-build
          path: portfolio-build.tar.gz
          retention-days: 7

      - name: Transfer build to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "portfolio-build.tar.gz"
          target: "/tmp"

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/home/ubuntu/portfolio' }}"

            # Create deployment directory if it doesn't exist
            mkdir -p $DEPLOY_PATH

            # Backup current deployment (for rollback)
            if [ -d "$DEPLOY_PATH/current" ]; then
              echo "Backing up current deployment..."
              rm -rf $DEPLOY_PATH/backup
              mv $DEPLOY_PATH/current $DEPLOY_PATH/backup
            fi

            # Extract new build
            echo "Extracting new build..."
            mkdir -p $DEPLOY_PATH/current
            tar -xzf /tmp/portfolio-build.tar.gz -C $DEPLOY_PATH/current

            # Create .env file with email configuration
            echo "Setting up environment variables..."
            cat > $DEPLOY_PATH/current/.env << 'EOF'
            EMAIL_HOST=${{ secrets.EMAIL_HOST || 'smtp.gmail.com' }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT || '587' }}
            EMAIL_SECURE=${{ secrets.EMAIL_SECURE || 'false' }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_TO=${{ secrets.EMAIL_TO }}
            EOF

            # Restart application with PM2
            echo "Restarting application..."
            cd $DEPLOY_PATH/current
            pm2 delete portfolio || true
            pm2 start ecosystem.config.js
            pm2 save

            # Cleanup
            rm -f /tmp/portfolio-build.tar.gz

            echo "Deployment completed successfully!"
